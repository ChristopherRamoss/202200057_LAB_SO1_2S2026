# permissions for end users to view grafanainstances.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: mumnk8s-operator
    app.kubernetes.io/managed-by: kustomize
  name: grafanainstance-viewer-role
rules:
- apiGroups:
  - cache.mumnk8s.io
  resources:
  - grafanainstances
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cache.mumnk8s.io
  resources:
  - grafanainstances/status
  verbs:
  - get
