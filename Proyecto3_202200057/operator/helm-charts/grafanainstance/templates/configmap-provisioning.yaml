apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-provisioning
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Valkey
        uid: valkey
        type: redis-datasource
        access: proxy
        url: redis://{{ .Values.valkey.address }}
        isDefault: true
        jsonData:
          client: standalone
          poolSize: 5
          timeout: 10
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: mumnk8s
        type: file
        disableDeletion: false
        options:
          path: /etc/grafana/dashboards
