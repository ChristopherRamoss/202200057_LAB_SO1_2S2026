apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-deployment2
  namespace: mumnk8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-deployment2
  template:
    metadata:
      labels:
        app: go-deployment2
    spec:
      containers:
        - name: grpc-server
          image: zot.local:5000/mumnk8s/grpc-server:v2
          ports:
            - containerPort: 50051
          env:
            - name: WRITER_URL
              value: "http://localhost:8081/publish"
          resources:
            requests:
              memory: "16Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
        - name: rabbit-writer
          image: zot.local:5000/mumnk8s/rabbit-writer:v1
          ports:
            - containerPort: 8081
          env:
            - name: RABBIT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBIT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: RABBITMQ_URL
              value: "amqp://$(RABBIT_USER):$(RABBIT_PASS)@rabbitmq:5672/"
          resources:
            requests:
              memory: "16Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: grpc-server
  namespace: mumnk8s
spec:
  selector:
    app: go-deployment2
  ports:
    - port: 50051
      targetPort: 50051
