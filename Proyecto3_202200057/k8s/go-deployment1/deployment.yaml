apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-deployment1
  namespace: mumnk8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-deployment1
  template:
    metadata:
      labels:
        app: go-deployment1
    spec:
      containers:
        - name: api
          image: zot.local:5000/mumnk8s/go-api:v1
          ports:
            - containerPort: 8080
          env:
            - name: GRPC_CLIENT_URL
              value: "http://localhost:9090/send"
          resources:
            requests:
              memory: "16Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
        - name: grpc-client
          image: zot.local:5000/mumnk8s/grpc-client:v2
          ports:
            - containerPort: 9090
          env:
            - name: GRPC_SERVER_ADDR
              value: "grpc-server:50051"
          resources:
            requests:
              memory: "16Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: go-api
  namespace: mumnk8s
spec:
  selector:
    app: go-deployment1
  ports:
    - port: 8080
      targetPort: 8080
