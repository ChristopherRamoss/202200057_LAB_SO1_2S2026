apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grpc-202200057
  namespace: mumnk8s
spec:
  parentRefs:
    - name: mumnk8s-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /grpc-202200057
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /report
      backendRefs:
        - name: rust-api
          port: 8000
