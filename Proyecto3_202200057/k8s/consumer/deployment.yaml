apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  namespace: mumnk8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      containers:
        - name: consumer
          image: zot.local:5000/mumnk8s/consumer:v1
          env:
            - name: RABBIT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBIT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: RABBITMQ_URL
              value: "amqp://$(RABBIT_USER):$(RABBIT_PASS)@rabbitmq:5672/"
            - name: VALKEY_ADDR
              value: "valkey:6379"
            - name: WORKERS
              value: "4"
          resources:
            requests:
              memory: "16Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
